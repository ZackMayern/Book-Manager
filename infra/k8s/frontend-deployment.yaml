apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-manager-ui
  namespace: book-manager
  labels:
    app: book-manager-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book-manager-ui
  template:
    metadata:
      labels:
        app: book-manager-ui
    spec:
      containers:
        - name: book-manager-ui
          image: ${FRONTEND_IMAGE_URI}
          imagePullPolicy: Always
          ports:
            - containerPort: 80