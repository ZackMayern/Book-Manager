<div class="container pt-3 d-flex justify-content-center align-items-center">
  <div class="col-md-4 bg-dark p-4 rounded">
    <h3 class="text-white">Sign up</h3>
    <form class="form my-4" [formGroup]="signupForm">
      <div class="mb-1">
        <label class="pb-1 text-white" for="email">E-mail</label>
        <input type="email" class="form-control" formControlName="email">
      </div>
      <div class="mb-1">
        <label class="pb-1 text-white" for="firstName">First Name</label>
        <input type="text" class="form-control" formControlName="firstName">
      </div>
      <div class="mb-1">
        <label class="pb-1 text-white" for="lastName">Last Name</label>
        <input type="text" class="form-control" formControlName="lastName">
      </div>
      <div class="mb-1">
        <label class="pb-1 text-white" for="password">Password</label>
        <input type="password" class="form-control" formControlName="password">
      </div>
    </form>

    <button type="button" class="btn btn-primary" (click)="submit()">Sign up</button>
  </div>
</div>
